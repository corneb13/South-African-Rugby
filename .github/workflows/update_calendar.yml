jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Bump to v5 to fix the Node.js warning
      - uses: actions/checkout@v5 
      
      # Bump to v6 to fix the Node.js warning
      - uses: actions/setup-python@v6 
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure requests is installed!
          pip install requests 
          
      - name: Run script
        run: python your_script_name.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add springboks.ics
          # The '|| echo' prevents Exit Code 1 if there are no new fixtures to commit
          git commit -m "Update Springboks calendar feed" || echo "No changes to commit"
          git push
