name: Update Springboks Calendar Feed

on:
  schedule:
    - cron: '0 6 * * *'  # Runs automatically every day at 06:00 UTC
  workflow_dispatch:      # Restores the manual "Run workflow" button
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Run script
        run: python generate_ics.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add springboks.ics
          git commit -m "Update Springboks calendar feed" || echo "No changes to commit"
          git push
