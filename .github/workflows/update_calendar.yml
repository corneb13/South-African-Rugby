name: Update Springboks Calendar Feed

on:
  schedule:
    - cron: '0 6 * * *'  # Runs automatically every day at 06:00 UTC
  workflow_dispatch:      # Restores the manual "Run workflow" button
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dateutil playwright icalendar
          playwright install chromium --with-deps

      - name: Run script
        run: python generate_ics.py

      - name: Upload snapshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springboks-snapshots
          path: |
            snapshots

      - name: Commit and push changes
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add springboks.ics
          git commit -m "Update Springboks calendar feed [skip ci]" || echo "No changes to commit"
          git push
