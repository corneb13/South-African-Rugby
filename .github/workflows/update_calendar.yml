jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Reverted back to the correct stable versions
      - uses: actions/checkout@v4 
      
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests 
          
      - name: Run script
        # IMPORTANT: Replace "your_script_name.py" with your actual python file name!
        run: generate_ics.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add springboks.ics
          git commit -m "Update Springboks calendar feed" || echo "No changes to commit"
          git push
